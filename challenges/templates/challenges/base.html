<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}ChallengeHub{% endblock %}</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="bg-light">
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold text-danger" href="{% url 'home' %}">
          ChallengeHub
        </a>

        <div class="d-flex align-items-center gap-2">
          {% if user.is_authenticated %}
          <a href="{% url 'feed' %}" class="btn btn-outline-light btn-sm"
            >Feed Comunitário</a
          >
          <a href="{% url 'dashboard' %}" class="btn btn-outline-light btn-sm"
            >Meu Dashboard</a
          >
          <span class="text-white small me-1"
            >Olá, <strong>@{{ user.username }}</strong></span
          >
          <a href="{% url 'challenge_create' %}" class="btn btn-danger btn-sm"
            >+ Novo Desafio</a
          >
          <a href="{% url 'logout' %}" class="btn btn-outline-danger btn-sm"
            >Sair</a
          >
          {% else %}
          <a
            href="{% url 'challenge_list' %}"
            class="btn btn-link text-white text-decoration-none btn-sm me-2"
            >Explorar</a
          >
          <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm"
            >Entrar</a
          >
          <a href="{% url 'register' %}" class="btn btn-danger btn-sm"
            >Criar Conta</a
          >
          {% endif %}
        </div>
      </div>
    </nav>

    <!-- Exibição de Mensagens de Feedback (Django Messages) -->
    <div class="container">
      {% if messages %} {% for message in messages %}
      <div
        class="alert alert-{{ message.tags }} alert-dismissible fade show shadow-sm"
        role="alert"
      >
        {{ message }}
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="alert"
          aria-label="Close"
        ></button>
      </div>
      {% endfor %} {% endif %}

      <!-- Conteúdo Principal -->
      {% block content %} {% endblock %}
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
