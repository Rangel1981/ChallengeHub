{% extends 'challenges/base.html' %} {% block title %}Entrar -
ChallengeHub{%endblock%} {% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-4">
    <div class="card shadow-sm border-0 p-4">
      <h3 class="fw-bold mb-3 text-center">Entrar</h3>
      <form method="POST">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">Usuário</label>
          <input type="text" name="username" class="form-control" required />
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Senha</label>
          <input
            type="password"
            name="password"
            class="form-control"
            required
          />
        </div>
        {% if form.errors %}
        <div class="alert alert-danger p-2 small">
          Usuário ou senha inválidos.
        </div>
        {% endif %}
        <button type="submit" class="btn btn-danger w-100 mt-2">Entrar</button>
      </form>
      <p class="text-center mt-3 mb-0 small">
        Não tem conta? <a href="{% url 'register' %}">Cadastre-se</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
